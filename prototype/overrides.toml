# Prototype (4156084E) - hand-written analysis overrides for default.xex.

# XAPI fibers are linked into the title. Swap them for the runtime's host-fiber
# versions: the guest SwitchToFiber swaps r1/LR by hand, which recompiled code
# cannot follow. Identified by KTHREAD.fiber_ptr (r13+256 -> +0x164) accesses,
# 0xA50-byte X_FIBER_CONTEXT allocations and SetLastError 1280/1281.
[rexcrt]
ConvertThreadToFiber = 0x82A53470
ConvertFiberToThread = 0x82A53500
CreateFiber = 0x82A53550    # MmCreateKernelStack, start stub 0x82A5ECE0
DeleteFiber = 0x82A53630
SwitchToFiber = 0x82A53690  # b 0x82A5ECF0 (register save/restore)

# Tail-call targets the analyzer left outside any function (first codegen run).
[functions]
0x826B7700 = {}  # b from 0x826B8158
0x8232E5B8 = {}  # b from 0x82418CE8
0x82B48530 = {}  # b from 0x82B466CC
0x82B500A0 = {}  # b from 0x82B466D4 (second run)

# sub_82A5ECE0 ends in a call to KeBugCheck, which never returns; the analyzer
# ran on into the next function (context capture: r13 thread, mfcr), which
# sub_82A53690 reaches with b 0x82A5ECF0. Split them.
0x82A5ECE0 = { end = 0x82A5ECF0 }
0x82A5ECF0 = {}

# Reached only through function pointers; found by running the PC build.
0x82B4B000 = {}  # run 2: right after audio init

